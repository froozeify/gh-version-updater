name: Release

on:
  release:
    types: [published]

jobs:
  update-readme:
    name: Bump README latest version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FROOZEIFY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FROOZEIFY_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7

      # Dogfooding: this action updates its own README using the same custom-rules
      - name: Update latest version in README
        uses: ./
        with:
          token: ${{ steps.app-token.outputs.token }}
          files: none
          custom-rules: |
            README.md:\*\*Latest version\:\*\* `[^`]*`:**Latest version\:** `v{version}`

  update-semver:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update major and minor tags
        uses: froozeify/gh-release-semver-autotag@v1
        with:
          mode: prefix
